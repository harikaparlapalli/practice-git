<!DOCTYPE html>
<html>
<head>
<title> Event Registration</title>
<link rel="stylesheet" href = "style.css">
</head>
<body>
<h1> Event Registration Form</h1>
<form id="registrationForm">
<label for="first"> First Name</label>
<input id="first" type="text" placeholder="First Name"><br>
<label for="last">Last Name</label>
<input id="last" type="text" placeholder="Last Name"><br>
<label for="email"> Email</label>
<input id="email" type="email" placeholder="Enter email"><br>
<label for="phone">Phone Number</label>
<input id="phone" type="tel" placeholder="Enter phone number"<br>
<label for="gender">Gender</label>
<input id="gender" type="text" placeholder="Gender"><br>
<label for="dob">Date of Birth</label>
<input id="dob" type="date"><br>
<label for="roll_num">Roll Number</label>
<input id="roll_num" type="text" placeholder="Enter roll number"><br>
<label for="event_name">Event Name</label>
<input id="event_name" type="text"><br>
<button type="submit">Register</button>
<p id="message"></p>
</form>
<script src="script.js"></script>
</body>
</html>
